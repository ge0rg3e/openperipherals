# Builds the Windows app and its installer on every push and pull request.
# Pushing a tag such as v0.2.0 also publishes them as a GitHub pre-release.
#
# Uses the Wails build pipeline (https://v3.wails.io, "Building" and
# "Windows" guides): `wails3 package` runs build/windows/Taskfile.yml, which
# builds the frontend, embeds the icon, manifest and version info, compiles
# with the production tag, then wraps the exe in an NSIS installer.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # for publishing releases on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        # Same version as the wails module in go.mod.
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "${env:ProgramFiles(x86)}\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Build app and installer
        run: wails3 package

      - uses: actions/upload-artifact@v4
        with:
          name: openperipherals-windows
          path: bin/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.exe
          prerelease: true
          generate_release_notes: true
