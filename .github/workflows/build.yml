# Builds and publishes a Windows release when a version tag such as v0.2.0 is pushed.
#
# Uses the Wails build pipeline (https://v3.wails.io, "Building" and
# "Windows" guides): `wails3 package` runs build/windows/Taskfile.yml, which
# builds the frontend, embeds the icon, manifest and version info, compiles
# with the production tag, then wraps the exe in an NSIS installer.
name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # for publishing releases on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        # Same version as the wails module in go.mod.
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "${env:ProgramFiles(x86)}\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Build app and installer
        shell: pwsh
        run: |
          $version = "0.0.1"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          wails3 package VERSION=$version INSTALL_SCOPE=user
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item bin/openperipherals.exe bin/openperipherals-updater-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: openperipherals-windows
          path: bin/openperipherals-amd64-installer.exe

      - name: Create signed updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WAILS_UPDATER_PRIVATE_KEY: ${{ secrets.WAILS_UPDATER_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:WAILS_UPDATER_PRIVATE_KEY) {
            throw 'Set the WAILS_UPDATER_PRIVATE_KEY repository secret to the private key generated for updater.key.pub.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'openperipherals-updater.key'
          [System.IO.File]::WriteAllText($keyPath, $env:WAILS_UPDATER_PRIVATE_KEY)
          try {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            wails3 updater manifest `
              -version $version `
              -key $keyPath `
              -url-prefix "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/" `
              -output bin/manifest.json `
              bin/openperipherals-updater-windows-amd64.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/openperipherals-amd64-installer.exe
            bin/openperipherals-updater-windows-amd64.exe
            bin/manifest.json
          generate_release_notes: true
